<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Everything on one page · Nemil Doshi</title>
<meta name="description" content="Nemil Doshi’s portfolio on one page.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23f4ecdc' stroke='%23141210' stroke-width='5'/%3E%3Crect x='28' y='18' width='8' height='28' rx='4' fill='%23141210'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Big Shoulders";src:url(big-shoulders-display.woff2) format("woff2");font-weight:700 900}
@font-face{font-family:"Big Shoulders";src:url(big-shoulders-display-ext.woff2) format("woff2");font-weight:700 900;unicode-range:U+0100-02BA,U+20A0-20C4}
@font-face{font-family:"Bricolage";src:url(bricolage-grotesque.woff2) format("woff2");font-weight:400 800}
@font-face{font-family:"Bricolage";src:url(bricolage-grotesque-ext.woff2) format("woff2");font-weight:400 800;unicode-range:U+0100-02BA,U+20A0-20C4}
:root{--ink:#eee9dc;--paper:#09151f;--accent:#d5bb83}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 Bricolage,system-ui,sans-serif}
main{max-width:780px;margin:0 auto;padding:28px 22px 60px}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;gap:12px;font:800 14px/1 "Big Shoulders",sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-bottom:34px}
h1{font:400 clamp(44px,10vw,76px)/1.05 Georgia,serif;margin:0 0 12px}
h2{font:400 30px/1.1 Georgia,serif;margin:46px 0 14px;padding-top:14px;border-top:1px solid #aec0bc33}
h3{font:500 20px/1.25 Bricolage,system-ui,sans-serif;margin:22px 0 4px}
.meta{font-size:14.5px;font-weight:600;margin:0 0 6px}
ul{padding-left:20px}
.deal{display:grid;grid-template-columns:auto 1fr;gap:4px 18px}
.deal dt{font-weight:700}.deal dd{margin:0}
blockquote{margin:16px 0 4px;font-size:17.5px}
.note{font-size:13.5px;margin-top:40px}
</style>
</head>
<body>
<main>
<p class="top"><a href="index.html">Back to the journey</a><a href="https://www.linkedin.com/in/nemil-doshi-08b6272b7/">LinkedIn</a></p>
<h1>Nemil Doshi</h1>
<div id="profile"><p>Loading portfolio…</p></div>
</main>
<script type="module">
import { D, esc, projects } from './folio-content.js?v=6';
const list = items => `<ul>${items.map(item => `<li>${esc(item)}</li>`).join('')}</ul>`;
document.getElementById('profile').innerHTML = `
  <p>${esc(D.bio)} I’m based in Gurugram, India.</p>
  <h2>Selected work</h2>
  ${projects.map(p => `<h3><a href="project.html?p=${p.slug}">${esc(p.short)}</a></h3>
    <p class="meta">${[p.type, p.role, p.year].filter(Boolean).map(esc).join(' · ')}</p>
    <p>${esc(p.result)}</p>${p.highlights ? list(p.highlights) : ''}`).join('')}
  <h2>Education</h2>${list(D.education.map(entry => entry.join(' · ')))}
  <h2>Skills</h2>${list(D.skills)}
  <h2>Certifications</h2>${list(D.certifications.map(entry => entry.join(' · ')))}
  <h2>Leadership and achievements</h2>
  ${D.achievements.map(([title, detail]) => `<h3>${esc(title)}</h3><p>${esc(detail)}</p>`).join('')}`;
</script>
</body></html>
